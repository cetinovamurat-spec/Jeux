# Déploiement « Blueprint » sur Render (offre gratuite)
services:
  - type: web
    name: olympiades-du-cabinet
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
